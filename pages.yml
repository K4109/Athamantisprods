media:
  input: assets
  output: /assets
  rename: safe
  categories:
  - image
content:
- name: home
  label: 01 · Página inicial
  type: group
  items:
  - name: ath-home-texts
    label: Textos e seções
    type: file
    path: data/ath-home-texts.json
    format: json
    fields:
    - name: hero_kicker_left
      label: Topo · assinatura
      type: string
    - name: hero_kicker_right
      label: Topo · localização
      type: string
    - name: hero_line1
      label: Abertura · título, primeira linha
      type: string
    - name: hero_line2
      label: Abertura · título, segunda linha
      type: string
    - name: hero_outline
      label: Abertura · destaque contornado
      type: string
    - name: hero_description
      label: Abertura · descrição
      type: text
    - name: work_intro
      label: Portfólio · introdução
      type: text
    - name: work_line1
      label: Portfólio · título 1
      type: string
    - name: work_line2
      label: Portfólio · título 2
      type: string
    - name: services_description
      label: Serviços · introdução
      type: text
    - name: contact_description
      label: Contato · introdução
      type: text
    - name: show_team
      label: Mostrar equipe
      type: boolean
      default: true
    - name: show_services
      label: Mostrar serviços
      type: boolean
      default: true
    - name: show_videos
      label: Mostrar vídeos
      type: boolean
      default: true
    - name: show_reviews
      label: Mostrar depoimentos
      type: boolean
      default: true
  - name: ath-home-images
    label: Fotos da abertura, redes e logo
    type: file
    path: data/ath-home-images.json
    format: json
    fields:
    - name: opening_1
      label: Abertura · foto 1
      type: image
      description: Primeira foto no topo.
    - name: opening_2
      label: Abertura · foto 2
      type: image
      description: Foto central no topo.
    - name: opening_3
      label: Abertura · foto 3
      type: image
      description: Terceira foto no topo.
    - name: social_1
      label: Instagram · foto 1
      type: image
      description: Primeira foto da seção de redes sociais.
    - name: social_2
      label: Instagram · foto 2
      type: image
      description: Segunda foto da seção de redes sociais.
    - name: social_3
      label: Instagram · foto 3
      type: image
      description: Terceira foto da seção de redes sociais.
    - name: logo
      label: Logo
      type: image
      description: Logo usada na abertura, na marca e no rodapé. Preserve as margens do arquivo atual.
  - name: inicio
    label: Fotografias em destaque
    type: file
    path: data/home.json
    format: json
    fields:
    - name: photo_limit
      label: Quantidade de fotos exibidas
      type: number
      default: 6
      description: 0 mostra todas. As fotos aparecem na ordem da lista.
    - name: photos
      label: Fotos da página inicial
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{title}'
      fields:
      - name: title
        label: Título da foto
        type: string
        required: true
      - name: image
        label: Fotografia
        type: image
        required: true
      - name: thumbnail
        label: Miniatura (opcional)
        type: image
      - name: alt
        label: Descrição acessível
        type: string
      - name: subtitle
        label: Texto abaixo do título
        type: string
      - name: category
        label: Categoria / filtro
        type: select
        options:
          values:
          - name: ensaios
            label: Ensaios
          - name: gestantes
            label: Gestantes
          - name: formaturas
            label: Formaturas
          - name: eventos
            label: Eventos
          - name: produtos
            label: Gastronomia & Produtos
          - name: empresas
            label: Empresas
      - name: tall
        label: Mostrar como cartão quadrado
        type: boolean
        default: false
      - name: monochrome
        label: Mostrar em preto e branco
        type: boolean
        default: false
- name: ath-covers
  label: 02 · Capas das especialidades
  type: file
  path: data/ath-covers.json
  format: json
  fields:
  - name: fotografia
    label: Fotografia
    type: object
    fields:
    - name: image
      label: Imagem de capa
      type: image
      description: Imagem do cartão Fotografia, antes de abrir os projetos.
    - name: position
      label: Posição do recorte
      type: select
      default: center
      options:
        values:
        - center
        - top
        - bottom
  - name: audiovisual
    label: Audiovisual
    type: object
    fields:
    - name: image
      label: Imagem de capa
      type: image
      description: Imagem do cartão Audiovisual, antes de abrir os projetos.
    - name: position
      label: Posição do recorte
      type: select
      default: center
      options:
        values:
        - center
        - top
        - bottom
  - name: design
    label: Design
    type: object
    fields:
    - name: image
      label: Imagem de capa
      type: image
      description: Imagem do cartão Design, antes de abrir os projetos.
    - name: position
      label: Posição do recorte
      type: select
      default: center
      options:
        values:
        - center
        - top
        - bottom
  - name: websites
    label: Websites
    type: object
    fields:
    - name: image
      label: Imagem de capa
      type: image
      description: Imagem do cartão Websites, antes de abrir os projetos.
    - name: position
      label: Posição do recorte
      type: select
      default: center
      options:
        values:
        - center
        - top
        - bottom
