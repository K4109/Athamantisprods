- name: about
  label: 07 · Marca e equipe
  type: group
  items:
  - name: ath-about
    label: A marca · textos
    type: file
    path: data/ath-about.json
    format: json
    fields:
    - name: about_intro
      label: A marca · introdução
      type: text
    - name: about_paragraph1
      label: A marca · texto 1
      type: text
    - name: about_paragraph2
      label: A marca · texto 2
      type: text
  - name: ath-team
    label: Equipe · integrantes
    type: file
    path: data/ath-team.json
    format: json
    fields:
    - name: heading
      label: Título do grupo (aparece com mais de uma pessoa)
      type: string
    - name: members
      label: Integrantes (adicionar / arrastar para ordenar)
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{name}'
      fields:
      - name: name
        label: Nome
        type: string
        required: true
      - name: role
        label: Cargo
        type: string
      - name: visible
        label: Exibir no site
        type: boolean
        default: true
      - name: photo
        label: Foto do integrante
        type: image
        required: true
      - name: alt
        label: Texto alternativo para acessibilidade
        type: string
      - name: photo_caption
        label: Legenda debaixo da foto
        type: string
      - name: eyebrow
        label: Chamada pequena acima do título
        type: string
      - name: headline1
        label: Título grande · primeira linha
        type: string
      - name: headline2
        label: Título grande · destaque cinza
        type: string
      - name: bio
        label: Biografia (separe parágrafos com linha em branco)
        type: text
      - name: links
        label: Links do integrante
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{label}'
        fields:
        - name: label
          label: Texto do link
          type: string
        - name: url
          label: Endereço completo https://
          type: string
- name: ath-services
  label: 08 · Serviços e orçamento · pacotes e valores
  type: file
  path: data/ath-services.json
  format: json
  fields:
  - name: services
    label: Serviços (reordenáveis)
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{name}'
    fields:
    - name: name
      label: Nome do serviço
      type: string
      required: true
    - name: category
      label: Área no Monte seu Projeto
      type: select
      options:
        values:
        - name: Fotografia
          label: Fotografia
        - name: Audiovisual
          label: Audiovisual
        - name: Design
          label: Design
        - name: Websites
          label: Websites
    - name: start
      label: Preço a partir de (texto)
      type: string
    - name: note
      label: Descrição do serviço
      type: text
    - name: details
      label: Explicação para o cliente (Ver detalhes)
      type: text
    - name: visible
      label: Mostrar no site
      type: boolean
      default: true
    - name: packages
      label: Pacotes dentro deste serviço
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{label}'
      fields:
      - name: label
        label: O que está incluído
        type: string
        required: true
      - name: on_request
        label: Preço sob consulta
        type: boolean
        default: true
        description: Ative quando o valor depender de uma conversa.
      - name: amount
        label: Valor em reais
        type: number
        description: 'Exemplo: 250. Usado quando Sob consulta está desativado.'
- name: ath-testimonials
  label: 09 · Depoimentos · clientes
  type: file
  path: data/ath-testimonials.json
  format: json
  fields:
  - name: subtitle
    label: Legenda superior da seção
    type: string
  - name: title
    label: Título da seção
    type: string
  - name: items
    label: Depoimentos (vazio = não aparece)
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{name}'
    fields:
    - name: name
      label: Nome do cliente (com autorização)
      type: string
      required: true
    - name: service
      label: Projeto / serviço realizado
      type: string
    - name: quote
      label: Depoimento autorizado
      type: text
      required: true
    - name: photo
      label: Foto do cliente (opcional)
      type: image
    - name: visible
      label: Exibir no site
      type: boolean
      default: true
- name: ath-settings
  label: 10 · Contato e redes sociais
  type: file
  path: data/ath-settings.json
  format: json
  fields:
  - name: instagram
    label: Instagram Athamantis · URL completa
    type: string
  - name: personal_instagram
    label: Instagram pessoal · URL completa
    type: string
  - name: facebook
    label: Facebook · URL completa
    type: string
  - name: email
    label: Email comercial
    type: string
  - name: whatsapp
    label: WhatsApp internacional só números · links
    type: string
