      label: Descrição curta
      type: text
    - name: image
      label: Imagem de capa
      type: image
      required: true
      description: Capa exibida na lista de projetos desta especialidade.
    - name: alt
      label: Descrição da imagem para acessibilidade
      type: string
    - name: link
      label: Link para visitar projeto (opcional)
      type: string
    - name: visible
      label: Projeto publicado
      type: boolean
      default: true
    list:
      collapsible:
        collapsed: true
        summary: '{title}'
