      list:
        collapsible:
          collapsed: true
          summary: '{title}'
      fields:
      - name: title
        label: Título da foto
        type: string
        required: true
      - name: image
        label: Foto principal (obrigatória)
        type: image
        required: true
      - name: thumbnail
        label: Miniatura (opcional; deixe vazia para usar foto principal)
