  - name: title
    label: Título da seção
    type: string
  - name: accent
    label: Continuação do título
    type: string
  - name: description
    label: Descrição
    type: text
  - name: videos
    label: Vídeos · arraste para ordenar
    type: object
    fields:
    - name: title
      label: Título
      type: string
      required: true
    - name: image
      label: Capa do vídeo
      type: image
      required: true
    - name: url
      label: Link do vídeo no Vimeo ou YouTube
      type: string
      required: true
    - name: visible
      label: Mostrar no site
      type: boolean
      default: true
    list:
      collapsible:
        collapsed: true
        summary: '{title}'
